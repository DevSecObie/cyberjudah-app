<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- CyberJudah's lion on the home screen (Safari "Add to Home Screen") and in the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CyberJudah" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown from the first byte until the app's first screen is up (bootSplash.web.ts). */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        transition: opacity 160ms ease-out;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      body {
        margin: 0;
      }
      .boot img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      /* The opening chapter, drawn by scripts/web-first-screen.js before the app has loaded. It
         copies the reading layout's default look (light and dark themes). */
      .fs {
        position: absolute;
        inset: 0;
        background: #ffffff;
        color: #000000;
        --fs-line: rgba(16, 27, 53, 0.14);
        --fs-pill: rgb(244, 247, 255);
        --fs-rule: rgb(89, 131, 240);
        --fs-muted: rgb(98, 113, 122);
      }
      .fs-dark {
        background: rgb(18, 45, 66);
        color: rgb(200, 200, 200);
        --fs-line: rgba(255, 255, 255, 0.12);
        --fs-pill: rgb(30, 61, 82);
        --fs-rule: rgb(14, 211, 185);
        --fs-muted: rgb(166, 190, 204);
      }
      .fs-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        box-sizing: border-box;
        border-bottom: 1px solid var(--fs-line);
        padding: 11px 10px;
      }
      .fs-pill {
        display: inline-flex;
        align-items: center;
        height: 32px;
        border-radius: 16px;
        background: var(--fs-pill);
        font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .fs-ref {
        padding: 0 7px 0 12px;
      }
      .fs-version {
        padding: 0 12px 0 7px;
        border-left: 1px solid var(--fs-line);
      }
      .fs-scroll {
        position: absolute;
        top: 54px;
        left: 0;
        right: 0;
        bottom: 48px;
        overflow-y: auto;
        padding: 70px 15px 300px;
        box-sizing: border-box;
      }
      .fs-header {
        padding: 22px 0 30px;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
      }
      .fs-title {
        margin: 0;
        font: 400 38px/43.7px 'Literata Book', Georgia, serif;
      }
      .fs-rule {
        width: 28px;
        height: 2px;
        margin: 16px auto 12px;
        background: var(--fs-rule);
      }
      .fs-chapter {
        display: block;
        font: 600 12px/16.8px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 1.68px;
        text-transform: uppercase;
        color: var(--fs-muted);
      }
      .fs-text {
        max-width: 800px;
        margin: 0 auto;
        font-family: 'Literata Book', Georgia, serif;
      }
      .fs-verse {
        padding: 4px;
      }
      .fs-number {
        font-size: 14px;
        padding: 0 2px;
        margin-right: 4px;
      }
      .fs-words {
        font-size: 19px;
        line-height: 35px;
      }
      .fs-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 48px;
        border-top: 1px solid var(--fs-line);
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #05070d;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="boot" class="boot" role="img" aria-label="Loading" aria-busy="true">
      <img src="/icon-192.png" alt="" />
    </div>
    <!-- first-screen -->
    <script>
      // If the app never reaches its first screen, stop covering whatever it shows instead.
      setTimeout(function () {
        var boot = document.getElementById('boot')
        if (boot) boot.remove()
      }, 30000)
    </script>
  </body>
</html>

<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- CyberJudah's lion on the home screen (Safari "Add to Home Screen") and in the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CyberJudah" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Opened from the Telegram bot: Telegram's Mini App script, then public/telegram.js. They
         load before the app so Telegram's launch data is read before the app changes the address;
         on the open web neither loads. -->
    <script>
      ;(function () {
        var kept = false
        try {
          kept = !!sessionStorage.getItem('__telegram__initParams')
        } catch (e) {}
        if (/[#&]tgWebApp(Data|Version|Platform)=/.test(location.hash) || kept) {
          document.write(
            '<script src="https://telegram.org/js/telegram-web-app.js?59"><\/script><script src="/telegram.js"><\/script>'
          )
        }
      })()
    </script>
    <style>
      /* Inside Telegram: clear of the phone's edges where Telegram reports them. */
      html.tg #root {
        box-sizing: border-box;
        padding-top: var(--tg-content-safe-area-inset-top, 0px);
        padding-bottom: var(--tg-safe-area-inset-bottom, 0px);
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown from the first byte until the app's first screen is up (bootSplash.web.ts). */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        transition: opacity 160ms ease-out;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      body {
        margin: 0;
      }
      .boot img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #05070d;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="boot" class="boot" role="img" aria-label="Loading" aria-busy="true">
      <img src="/icon-192.png" alt="" />
    </div>
    <script>
      // If the app never reaches its first screen, stop covering whatever it shows instead.
      setTimeout(function () {
        var boot = document.getElementById('boot')
        if (boot) boot.remove()
      }, 30000)
    </script>
  </body>
</html>

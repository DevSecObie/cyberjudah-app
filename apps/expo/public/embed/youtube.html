<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>CyberJudah video player</title>

    <style>
      html,
      body,
      #player {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .error {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="player"></div>

    <script>
      // CyberJudah's own copy of the reader's video page: it plays one YouTube video by id,
      // without YouTube's tracking cookies, and never loads anything a caller names.
      const player = document.getElementById('player')
      const searchParams = new URLSearchParams(window.location.search)
      const videoId = searchParams.get('v') || ''
      const requestedAppId = searchParams.get('appId') || ''
      // Where to start, in whole seconds: the moment a class read the verse.
      const start = /^\d{1,6}$/.test(searchParams.get('start') || '')
        ? searchParams.get('start')
        : ''
      const appId = /^[A-Za-z0-9.-]+$/.test(requestedAppId) ? requestedAppId : 'io.cyberjudah.app'

      if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        player.className = 'error'
        player.textContent = 'This video could not be found.'
      } else {
        const playerParams = new URLSearchParams({
          autoplay: '1',
          playsinline: '1',
          rel: '0',
          // Lets the page hear the playing time, below.
          enablejsapi: '1',
          origin: window.location.origin,
          widget_referrer: `https://${appId}`,
        })
        if (start && start !== '0') playerParams.set('start', start)
        const iframe = document.createElement('iframe')

        iframe.src =
          `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}` +
          `?${playerParams.toString()}`
        iframe.title = 'YouTube video player'
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'
        iframe.allowFullscreen = true
        iframe.referrerPolicy = 'strict-origin-when-cross-origin'

        player.appendChild(iframe)

        // Tell the app where the video is, about once a second, so a class picks up at the same
        // moment when it moves between screens. Only the time is sent, and only to the app that
        // opened this page: the phone's web view, or the page this one is framed in.
        window.__cyberJudahClassTime = true
        let heard = false
        let last = -1
        const hello = () =>
          iframe.contentWindow &&
          iframe.contentWindow.postMessage(
            JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }),
            'https://www.youtube-nocookie.com'
          )
        const tell = time => {
          const message = JSON.stringify({ classTime: time })
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(message)
          else if (window.parent !== window) window.parent.postMessage(message, '*')
        }
        window.addEventListener('message', event => {
          if (
            event.origin !== 'https://www.youtube-nocookie.com' ||
            event.source !== iframe.contentWindow
          )
            return
          let data
          try {
            data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data
          } catch {
            return
          }
          heard = true
          const time = data && data.info && data.info.currentTime
          if (typeof time !== 'number' || Math.floor(time) === last) return
          last = Math.floor(time)
          tell(time)
        })
        // The video is started again at a new moment by changing its address; greet it again.
        iframe.addEventListener('load', () => {
          heard = false
          hello()
        })
        setInterval(() => {
          if (!heard) hello()
        }, 1000)
      }
    </script>
  </body>
</html>

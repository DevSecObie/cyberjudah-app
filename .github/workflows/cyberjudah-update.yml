name: Publish CyberJudah app update

# Manual only, like Bible Strong's expo-update-production.yml (docs/adr/0085): sends the app's
# JavaScript to our own Open OTA server at updates.cyberjudah.io. Every staging or production
# publish waits for the owner's approval through the app-store environment. A preview publish
# reaches only the owner's CyberJudah Preview app (channel "preview", iPhone) and runs in the
# ota-preview environment, so a change can be checked on the phone without the Mac.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which builds receive it
        required: true
        type: choice
        options: [preview, staging, production]
      message:
        description: What the update changes (defaults to the last commit)
        required: false
        type: string

concurrency:
  group: cyberjudah-update-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish update (${{ inputs.channel }})
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.channel == 'preview' && 'ota-preview' || 'app-store' }}
    steps:
      - name: Check for the publish token
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
        run: test -n "$OTA_PUBLISH_TOKEN" || { echo "Add the OTA_PUBLISH_TOKEN secret before publishing."; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Publish
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
          UPDATE_MESSAGE: ${{ inputs.message }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          message="${UPDATE_MESSAGE:-$(git log -1 --pretty=%s)} (${GITHUB_SHA::7})"
          yarn workspace @bible-strong/expo "update:cyberjudah:$CHANNEL" --message "$message"
      # Source maps for GlitchTip: the NAS (ask-cyberjudah-monitoring, sourcemap-sync) downloads
      # every cyberjudah-sourcemaps-* artifact and uploads it, so crash reports show the real file
      # and line. Never blocks the build: if this fails, only the stack traces stay unreadable.
      - name: Collect the source maps
        id: sourcemaps
        continue-on-error: true
        run: |
          set -euo pipefail
          pairs=()
          for map in apps/expo/dist/_expo/static/js/*/*.hbc.map; do
            pairs+=("${map%.map}" "$map")
          done
          (( ${#pairs[@]} > 0 )) || { echo '::warning::The export wrote no Hermes source maps'; exit 1; }
          apps/expo/scripts/collect-sourcemaps.sh "$RUNNER_TEMP/sourcemaps" "${pairs[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.sourcemaps.outcome == 'success'
        continue-on-error: true
        with:
          name: cyberjudah-sourcemaps-ota-${{ inputs.channel }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sourcemaps
          retention-days: 7
          if-no-files-found: error

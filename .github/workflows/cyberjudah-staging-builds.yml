name: CyberJudah mobile compatibility and Android staging
on:
  push:
    branches: [codex/bible-strong-mobile-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberjudah-staging-builds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # The web export peaks near 7 GB and runs out of memory at Node's default ~4 GB heap.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - run: cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
      - run: yarn workspace @bible-strong/expo typecheck
      - run: yarn workspace @bible-strong/expo test --runInBand
      - run: node --experimental-strip-types apps/expo/scripts/verify-cyberjudah-offline.mjs
      - run: yarn workspace @bible-strong/expo web:export
      - uses: actions/upload-artifact@v4
        with:
          name: CyberJudah-staging-web
          path: apps/expo/dist
          retention-days: 14
  android:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: ubuntu-latest
    environment: testflight
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - run: cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
      - run: yarn workspace @bible-strong/expo exec expo prebuild --platform android --no-install
      - run: node apps/expo/scripts/verify-cyberjudah-native-config.mjs android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Configure the private staging signing key
        env:
          CJ_KEYSTORE: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
        run: |
          test -n "$CJ_KEYSTORE"
          printf '%s' "$CJ_KEYSTORE" | base64 --decode > apps/expo/android/app/staging.p12
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/expo/android/app/build.gradle')
          s=p.read_text().replace('signingConfigs {', '''signingConfigs {
                  staging {
                      storeFile file('staging.p12')
                      storePassword System.getenv('CJ_SIGNING_PASSWORD')
                      keyAlias 'cyberjudah-staging'
                      keyPassword System.getenv('CJ_SIGNING_PASSWORD')
                  }
          ''',1)
          s=s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.staging')
          p.write_text(s)
          PY
      - name: Build an installable staging APK
        working-directory: apps/expo/android
        env:
          CJ_SIGNING_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: CyberJudah-staging-Android
          path: apps/expo/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
      # Source maps for GlitchTip: the NAS (ask-cyberjudah-monitoring, sourcemap-sync) downloads
      # every cyberjudah-sourcemaps-* artifact and uploads it, so crash reports show the real file
      # and line. Never blocks the build: if this fails, only the stack traces stay unreadable.
      - name: Collect the source map
        id: sourcemaps
        continue-on-error: true
        run: |
          set -euo pipefail
          # React Native's Hermes step writes the composed map here; Sentry's own upload is off.
          map=apps/expo/android/app/build/generated/sourcemaps/react/release/index.android.bundle.map
          test -s "$map" || { echo "::warning::No source map at $map"; exit 1; }
          apk=$(find apps/expo/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          mkdir -p "$RUNNER_TEMP/staging-bundle"
          unzip -p "$apk" assets/index.android.bundle > "$RUNNER_TEMP/staging-bundle/index.android.bundle"
          apps/expo/scripts/collect-sourcemaps.sh "$RUNNER_TEMP/sourcemaps" "$RUNNER_TEMP/staging-bundle/index.android.bundle" "$map"
      - uses: actions/upload-artifact@v4
        if: steps.sourcemaps.outcome == 'success'
        continue-on-error: true
        with:
          name: cyberjudah-sourcemaps-android-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/sourcemaps
          # As long as the app artifact: if the NAS is offline, the maps wait for it.
          retention-days: 30
          if-no-files-found: error

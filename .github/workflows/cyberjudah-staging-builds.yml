name: CyberJudah staging builds
on:
  push:
    branches: [codex/bible-strong-web-port]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberjudah-staging-builds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - run: cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
      - run: yarn workspace @bible-strong/expo typecheck
      - run: yarn workspace @bible-strong/expo exec jest src/helpers/__tests__/firestoreScope-test.ts src/helpers/__tests__/FireAuth.web-test.ts src/helpers/__tests__/cyberJudahCatalog-test.ts --runInBand
      - run: yarn workspace @bible-strong/expo exec expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: CyberJudah-staging-web
          path: apps/expo/dist
          retention-days: 14
  android:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - run: cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
      - run: yarn workspace @bible-strong/expo exec expo prebuild --platform android --no-install
      - name: Configure the private staging signing key
        env:
          CJ_KEYSTORE: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
        run: |
          test -n "$CJ_KEYSTORE"
          printf '%s' "$CJ_KEYSTORE" | base64 --decode > apps/expo/android/app/staging.p12
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/expo/android/app/build.gradle')
          s=p.read_text().replace('signingConfigs {', '''signingConfigs {
                  staging {
                      storeFile file('staging.p12')
                      storePassword System.getenv('CJ_SIGNING_PASSWORD')
                      keyAlias 'cyberjudah-staging'
                      keyPassword System.getenv('CJ_SIGNING_PASSWORD')
                  }
          ''',1)
          s=s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.staging')
          p.write_text(s)
          PY
      - name: Build an installable staging APK
        working-directory: apps/expo/android
        env:
          CJ_SIGNING_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: CyberJudah-staging-Android
          path: apps/expo/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
  ios:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - run: cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
      - run: yarn workspace @bible-strong/expo exec expo prebuild --platform ios --no-install
      - run: pod install --project-directory=apps/expo/ios
      - name: Compile iPhone archive without signing or publishing
        run: |
          workspace=$(find apps/expo/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CyberJudah-Staging.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive > "$RUNNER_TEMP/ios-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ios-build.log"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/CyberJudah-Staging.xcarchive" "$RUNNER_TEMP/CyberJudah-Staging-unsigned.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CyberJudah-staging-iPhone-unsigned
          path: |
            ${{ runner.temp }}/CyberJudah-Staging-unsigned.zip
            ${{ runner.temp }}/ios-build.log
          retention-days: 14

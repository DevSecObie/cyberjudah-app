name: CyberJudah mobile compatibility and Android staging
on:
  push:
    branches: [codex/bible-strong-mobile-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberjudah-staging-builds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - run: cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
      - run: yarn workspace @bible-strong/expo typecheck
      - run: yarn workspace @bible-strong/expo test --runInBand
      - run: node --experimental-strip-types apps/expo/scripts/verify-cyberjudah-offline.mjs
      - run: yarn workspace @bible-strong/expo exec expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: CyberJudah-staging-web
          path: apps/expo/dist
          retention-days: 14
  android:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - run: cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
      - run: yarn workspace @bible-strong/expo exec expo prebuild --platform android --no-install
      - run: node apps/expo/scripts/verify-cyberjudah-native-config.mjs android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Configure the private staging signing key
        env:
          CJ_KEYSTORE: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
        run: |
          test -n "$CJ_KEYSTORE"
          printf '%s' "$CJ_KEYSTORE" | base64 --decode > apps/expo/android/app/staging.p12
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/expo/android/app/build.gradle')
          s=p.read_text().replace('signingConfigs {', '''signingConfigs {
                  staging {
                      storeFile file('staging.p12')
                      storePassword System.getenv('CJ_SIGNING_PASSWORD')
                      keyAlias 'cyberjudah-staging'
                      keyPassword System.getenv('CJ_SIGNING_PASSWORD')
                  }
          ''',1)
          s=s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.staging')
          p.write_text(s)
          PY
      - name: Build an installable staging APK
        working-directory: apps/expo/android
        env:
          CJ_SIGNING_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: CyberJudah-staging-Android
          path: apps/expo/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

name: CyberJudah signed iPhone staging build
on:
  workflow_dispatch:
  push:
    branches: [codex/bible-strong-mobile-release]
permissions:
  contents: read
concurrency:
  group: cyberjudah-ios-signed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-signed:
    if: github.repository == 'DevSecObie/cyberjudah-app'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      CYBERJUDAH_APPLE_TEAM_ID: M8DUMWBXLH
    steps:
      - uses: actions/checkout@v4
      - run: python3 apps/expo/scripts/test-ios-signing.py
      - name: Install the approved staging signing assets
        env:
          CJ_IOS_CERTIFICATE: ${{ secrets.IOS_STAGING_CERTIFICATE_BASE64 }}
          CJ_IOS_PASSWORD: ${{ secrets.IOS_STAGING_CERTIFICATE_PASSWORD }}
          CJ_IOS_PROFILE: ${{ secrets.IOS_STAGING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CJ_IOS_CERTIFICATE" && test -n "$CJ_IOS_PASSWORD" && test -n "$CJ_IOS_PROFILE" || { echo 'Approved staging signing secrets are missing'; exit 1; }
          umask 077
          printf '%s' "$CJ_IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/staging.p12"
          printf '%s' "$CJ_IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/staging.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/staging.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 apps/expo/scripts/prepare-ios-signing.py "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ios-signing"
          CJ_KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$CJ_KEYCHAIN_PASSWORD"
          security create-keychain -p "$CJ_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/staging.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/staging.keychain-db"
          security unlock-keychain -p "$CJ_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/staging.keychain-db"
          security import "$RUNNER_TEMP/staging.p12" -P "$CJ_IOS_PASSWORD" -k "$RUNNER_TEMP/staging.keychain-db" -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$CJ_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/staging.keychain-db" > /dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/staging.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/staging.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/CyberJudah-Staging.mobileprovision"
          security find-identity -v -p codesigning "$RUNNER_TEMP/staging.keychain-db"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @bible-strong/expo
      - name: Use only the CyberJudah staging settings
        run: |
          cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
          # Bible Strong's own environment files must not be loadable by the release bundler.
          rm -f apps/expo/.env.production apps/expo/.env.staging apps/expo/.env.development
      - run: yarn workspace @bible-strong/expo typecheck
      - run: yarn workspace @bible-strong/expo test --runInBand
      - name: Give the CyberJudah settings to the native build
        # Build 303's bundle came out without them although Expo loaded .env.local, so every
        # later process, including the Xcode bundle phase and its Metro workers, gets them too.
        run: |
          grep -E '^[A-Z_][A-Z0-9_]*=' apps/expo/.env.cyberjudah.example | sed -E 's/^([A-Z0-9_]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"
          echo NODE_ENV=production >> "$GITHUB_ENV"
      - run: yarn workspace @bible-strong/expo exec expo prebuild --platform ios --no-install
      - run: node apps/expo/scripts/verify-cyberjudah-native-config.mjs ios
      - run: pod install
        working-directory: apps/expo/ios
      - run: ruby apps/expo/scripts/configure-ios-signing.rb "$RUNNER_TEMP/ios-signing/signing.json"
      - name: Archive and export a signed IPA without uploading
        run: |
          set -euo pipefail
          workspace=$(find apps/expo/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CyberJudah-Staging.xcarchive" archive > "$RUNNER_TEMP/ios-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ios-build.log"; exit 1; }
          app=$(find "$RUNNER_TEMP/CyberJudah-Staging.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict "$app"
          node apps/expo/scripts/verify-cyberjudah-bundle.mjs "$app/main.jsbundle"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CyberJudah-Staging.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ios-signing/ExportOptions.plist" -exportPath "$RUNNER_TEMP/CyberJudah-Staging-IPA" > "$RUNNER_TEMP/ios-export.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ios-export.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CyberJudah-staging-iPhone-signed
          path: |
            ${{ runner.temp }}/CyberJudah-Staging-IPA/*.ipa
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-export.log
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/staging.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/CyberJudah-Staging.mobileprovision" "$RUNNER_TEMP/staging.p12" "$RUNNER_TEMP/staging.mobileprovision" "$RUNNER_TEMP/profile.plist"
